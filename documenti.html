<!DOCTYPE html>

  <style>
  :root {
    --menu-width: 200px;
    --menu-bg: #003366;
    --btn-bg: #0059b3;
    --btn-hover: #0073e6;
    --page-bg: #e6f2ff;
  }

  body {
    margin: 0;
    background-color: var(--page-bg);
    font-family: Arial, sans-serif;
  }

  /* MENU LATERALE */
  nav#menu {
    position: fixed;
    top: 0;
    left: 0;
    width: var(--menu-width);
    height: 100vh;
    background-color: var(--menu-bg);
    padding: 20px;
    box-sizing: border-box;
    color: white;
  }

  nav#menu h2 {
    text-align: center;
    margin-top: 0;
  }

  nav#menu a.btn {
    display: block;
    background-color: var(--btn-bg);
    color: white;
    padding: 12px;
    margin: 12px 0;
    text-decoration: none;
    text-align: center;
    border-radius: 8px;
    font-weight: bold;
    transition: 0.2s;
  }

  nav#menu a.btn:hover {
    background-color: var(--btn-hover);
  }

  /* CONTENUTO DELLA PAGINA */
  main {
    margin-left: calc(var(--menu-width) + 30px);
    padding: 20px;
  }
</style>

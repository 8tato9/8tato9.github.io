<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giochi</title>

  <style>
    :root {
      --menu-width: 200px;
      --menu-bg: #003366;
      --btn-bg: #0059b3;
      --btn-hover: #0073e6;
      --page-bg: #e6f2ff;
    }

    body {
      margin: 0;
      background-color: var(--page-bg);
      font-family: Arial, sans-serif;
    }

    /* HAMBURGER (solo mobile) */
    #hamburger {
      display: none;
      font-size: 32px;
      cursor: pointer;
      padding: 15px;
      background-color: var(--menu-bg);
      color: white;
      width: 100%;
      box-sizing: border-box;
    }

    /* MENU LATERALE */
    nav#menu {
      position: fixed;
      top: 0;
      left: 0;
      width: var(--menu-width);
      height: 100vh;
      background-color: var(--menu-bg);
      padding: 20px;
      box-sizing: border-box;
      color: white;
      transition: transform 0.3s ease;
    }

    nav#menu h2 {
      text-align: center;
      margin-top: 0;
    }

    nav#menu a.btn {
      display: block;
      background-color: var(--btn-bg);
      color: white;
      padding: 12px;
      margin: 12px 0;
      text-decoration: none;
      text-align: center;
      border-radius: 8px;
      font-weight: bold;
      transition: 0.2s;
    }

    nav#menu a.btn:hover {
      background-color: var(--btn-hover);
    }

    /* CONTENUTO DELLA PAGINA */
    main {
      margin-left: calc(var(--menu-width) + 30px);
      padding: 20px;
    }

    /* RESPONSIVE */
    @media (max-width: 768px) {

      #hamburger {
        display: block;
      }

      nav#menu {
        transform: translateX(-100%);
      }

      nav#menu.open {
        transform: translateX(0);
      }

      main {
        margin-left: 0;
      }
    }
  </style>
</head>

<body>

<!-- HAMBURGER FUORI DAL MENU -->
<div id="hamburger">☰ Menu</div>

<!-- MENU RESPONSIVE -->
<nav id="menu" aria-label="Menu laterale">
  <h2>Menu</h2>
  <a class="btn" href="index.html">🏠 Home</a>
  <a class="btn" href="galleria.html">📷 Galleria</a>
  <a class="btn" href="documenti.html">🗂️ Documenti</a>
  <a class="btn" href="giochino.html">🎮 Gioco</a>
  <a class="btn" href="lezioni.html">📖 Lezioni Svolte</a>
</nav>

<main>
  <h1>Giochi</h1>
  <p>In questa pagina sono presenti dei videogames creati con mBlock o Scratch.</p>

  <section style="text-align:center;">
    <h2>Shooter Airplane</h2>
	   
    <h3>Usa le frecce per muovere l’aereo e la lettera “F” per sparare</h3>

    <div id="gioco-container"
         style="width:800px; height:600px; border:1px solid #ccc; cursor:pointer; margin:auto;">
      <iframe id="aereo"
              src="giochino/sb3.html"
              width="100%"
              height="100%"
              style="border:0;"
              allow="fullscreen"
              allowfullscreen>
      </iframe>
    </div>
   
  </section>
</main>

<footer style="text-align:center; margin-top:20px;">
  <p>© 2026</p>
</footer>

<!-- FULLSCREEN SCRIPT -->
<script>
  const container = document.getElementById("gioco-container");

  container.addEventListener("click", () => {
    if (container.requestFullscreen) {
      container.requestFullscreen();
    } else if (container.webkitRequestFullscreen) {
      container.webkitRequestFullscreen();
    } else if (container.msRequestFullscreen) {
      container.msRequestFullscreen();
    }
  });
</script>

<!-- MENU SCRIPT -->
<script>
  const menu = document.getElementById("menu");
  const hamburger = document.getElementById("hamburger");

  hamburger.addEventListener("click", () => {
    menu.classList.toggle("open");
  });
</script>

</body>
</html>

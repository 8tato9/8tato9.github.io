<!DOCTYPE html>
<html lang="it">
<head>
  <style>
  :root {
    --menu-width: 200px;
    --menu-bg: #003366;
    --btn-bg: #0059b3;
    --btn-hover: #0073e6;
    --page-bg: #e6f2ff;
  }

  body {
    margin: 0;
    background-color: var(--page-bg);
    font-family: Arial, sans-serif;
  }

  /* MENU LATERALE */
  nav#menu {
    position: fixed;
    top: 0;
    left: 0;
    width: var(--menu-width);
    height: 100vh;
    background-color: var(--menu-bg);
    padding: 20px;
    box-sizing: border-box;
    color: white;
  }

  nav#menu h2 {
    text-align: center;
    margin-top: 0;
  }

  nav#menu a.btn {
    display: block;
    background-color: var(--btn-bg);
    color: white;
    padding: 12px;
    margin: 12px 0;
    text-decoration: none;
    text-align: center;
    border-radius: 8px;
    font-weight: bold;
    transition: 0.2s;
  }

  nav#menu a.btn:hover {
    background-color: var(--btn-hover);
  }

  /* CONTENUTO DELLA PAGINA */
  main {
    margin-left: calc(var(--menu-width) + 30px);
    padding: 20px;
  }
</style>


  <meta charset="utf-8">
  <title>Immagini</title>
</head>
<body>
 <nav id="menu" aria-label="Menu laterale">
  <h2>Menu</h2>
  <a class="btn" href="index.html">🏠 Home</a>
  <a class="btn" href="galleria.html">📷 Galleria</a>
  <a class="btn" href="documenti.html">🗂️ Documenti</a>
  <a class="btn" href="giochi.html">🎮 Gioco</a>

</nav>


  <main>
    <h1>Giochi</h1>
    <p>In questa pagina sono presenti dei videogames creati con mblock o scratch</p>
  </main>

<center>
<section>
    <h2>Shooter Airplane</h2>
    <h3> Utilizza le frecce della tastiera per spostare l'aereo, e la lettera "F" per sparare </h3>	
    <div id="gioco-container" style="width:800px; height:600px; border:1px solid #ccc; cursor:pointer;">
        <iframe id="aereo" 
        src="giochino/sb3.html"
        width="100%" 
        height="100%" 
        style="border:0;"
        allow="fullscreen"
	allowfullscreen>
</iframe>

    </div>
</section>

  <footer>
    <p>© 2026</p>
  </footer>
<script>
const container = document.getElementById("gioco-container");

// ENTRA IN FULLSCREEN AL CLICK
container.addEventListener("click", () => {
    if (container.requestFullscreen) {
        container.requestFullscreen();
    } else if (container.webkitRequestFullscreen) {
        container.webkitRequestFullscreen();
    } else if (container.msRequestFullscreen) {
        container.msRequestFullscreen();
    }
});

// USCITA CON ESC (gestita automaticamente dal browser)
document.addEventListener("fullscreenchange", () => {
    if (!document.fullscreenElement) {
        console.log("Uscito dal fullscreen");
    }
});
</script>

</body>
</html>
